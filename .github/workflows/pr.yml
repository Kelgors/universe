name: Check Pull Request
on:
  pull_request:
    branches:
      - main

jobs:
  check:
    name: Check PR
    runs-on: ubuntu-24.04
    container: node:24-alpine
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: system_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm exec turbo check

      - name: Run build
        run: pnpm exec turbo build

      - name: Migrate database
        run: pnpm exec turbo test:migrate

      - name: Run tests
        run: pnpm exec turbo test -- --passWithNoTests


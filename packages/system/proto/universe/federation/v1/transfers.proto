syntax = "proto3";

package universe.federation.v1;

message TransferInitRequest {
  string request_id = 1;
  string source_system_id = 2;
  string target_system_id = 3;
  string player_id = 4;
  int64 timestamp = 5;
}

message TransferInitResponse {
  string id = 1;
  string request_id = 2;
  string source_system_id = 3;
  string target_system_id = 4;
  string player_id = 5;
  int64 timestamp = 6;
}

message TransferSnapshotRequest {
  string transfer_id = 1;
  string request_id = 2;
  bytes snapshot_data = 3;
  bytes snapshot_hash = 4;
  int64 timestamp = 5;
}

message MobilePlayerData {
  string player_id = 1;
  string player_name = 2;
}

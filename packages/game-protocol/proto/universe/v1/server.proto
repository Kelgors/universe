syntax = "proto3";

package universe.v1;

message ServerSetValue {
  string eid   = 1;
  string cid   = 2;
  string key   = 3;
  bytes  value = 4;
  int64  nonce = 5;
}

message ServerSnapshot {
  string id        = 1;
  bytes  data      = 2;
  string checksum  = 3;
  int64  timestamp = 4;
}

enum ServerCommandType {
  SERVER_COMMAND_TYPE_UNSPECIFIED = 0;
  SERVER_COMMAND_TYPE_HANDSHAKE   = 1;
  SERVER_COMMAND_TYPE_SNAPSHOT    = 2;
  SERVER_COMMAND_TYPE_SET_VALUE   = 3;
}

message ServerSignedEnveloppe {
  string            player_id = 1;
  ServerCommandType type      = 2;
  bytes             message   = 3;
  bytes             signature = 4;
}

message HandshakeResponse {
  int64  player_id   = 1;
  string player_name = 2;
  int64  nonce       = 3;
}

message AlignToResponse {
  int64 started_at      = 1;
  int64 target_rotation = 2;
  int64 nonce          = 3;
}

message MoveToResponse {
  int64 started_at = 1;
  int64 target_x   = 2;
  int64 target_y   = 3;
  int64 nonce      = 4;
}

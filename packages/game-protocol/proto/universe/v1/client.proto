syntax = "proto3";

package universe.v1;

enum ClientCommandType {
  CLIENT_COMMAND_TYPE_UNSPECIFIED = 0;
  CLIENT_COMMAND_TYPE_HANDSHAKE   = 1;
  CLIENT_COMMAND_TYPE_ALIGN_TO    = 2;
  CLIENT_COMMAND_TYPE_MOVE_TO     = 3;
}

message ClientSignedEnveloppe {
  ClientCommandType type      = 1;
  bytes             message   = 2;
  bytes             signature = 3;
}

message CommandHandshake {
  string player_name = 1;
}

message CommandAlignTo {
  int64 x = 1;
  int64 y = 2;
}

message CommandMoveTo {
  int64 x = 1;
  int64 y = 2;
}
